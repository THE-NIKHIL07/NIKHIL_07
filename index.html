      document.body.appendChild(modalEl);

      modalEl.addEventListener('click', function(e) {
        if (e.target === modalEl) closeModal();
      });

      document.getElementById('close-modal-btn').addEventListener('click', closeModal);

      loadHCaptcha();
    }

    function closeModal() {
      if (modalEl && modalEl.parentNode) {
        modalEl.parentNode.removeChild(modalEl);
        modalEl = null;
      }
    }

    function loadHCaptcha() {
      function renderWidget() {
        const box = document.getElementById('modal-captcha-container');
        if (!box) return;
        box.innerHTML = '';
        if (window.hcaptcha) {
          window.hcaptcha.render(box, {
            sitekey: 'da245811-4a81-48fd-923c-8d4a527b6c74',
            theme: 'dark',
            callback: function(token) {
              box.innerHTML = '<a href="mailto:nikhilbisht058@gmail.com" class="font-mono text-sm text-sky-400 underline decoration-sky-400/40 underline-offset-4 transition hover:decoration-sky-400">nikhilbisht058@gmail.com</a>';
            }
          });
        }
      }

      if (window.hcaptcha) {
        renderWidget();
      } else {
        const script = document.createElement('script');
        script.src = 'https://js.hcaptcha.com/1/api.js?render=explicit';
        script.async = true;
        script.defer = true;
        script.onload = renderWidget;
        document.head.appendChild(script);
      }
    }

    document.addEventListener('click', function(e) {
      const emailTarget = e.target.closest('[aria-label="Email"], [title="Email"], a[href^="mailto"]');
      if (emailTarget) {
        e.preventDefault();
        openModal();
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      initExactParticles();
      initEmailModal();
    });
  } else {
    initExactParticles();
    initEmailModal();
  }
})();
</script>
